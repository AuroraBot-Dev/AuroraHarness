[project]
name = "aurora-agent"
version = "0.2.0"
description = "Aurora Agent 运行时后端（agent 层：运行时 / 图 / 工具 / 沙箱 / 存储 / 传输）"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13,<3.15"
dependencies = [
    "keyring>=25.7.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=1.6.0",
    "langgraph>=0.2.0",
    "mcp>=2.0.0,<3",
    "playwright>=1.62.0",
    "python-dotenv>=1.2.3",
    "pywin32>=311 ; sys_platform == 'win32'",
    "pyyaml>=6.0,<7",
    "rich>=15.0.0",
    "sqlalchemy>=2.0,<3",
    "websockets>=16,<17",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["aurora", "aurora.agent*", "aurora.eval*"]

[tool.setuptools.package-data]
"aurora.agent.mcp.packages" = ["*/package.yaml"]
"aurora.agent.store" = ["migrations/*.sql"]
