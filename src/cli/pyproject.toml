[project]
name = "aurora-cli"
version = "0.2.0"
description = "Aurora Agent 命令行入口（cli 层：参数解析与命令分发）"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13,<3.15"
dependencies = ["aurora-agent"]

[project.scripts]
aurora = "aurora.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["aurora.cli*"]
