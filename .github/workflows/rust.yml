name: Rust

# 两个作业都跑三平台：这是跨平台桌面应用，Windows / macOS 上的编译失败必须在 PR 阶段暴露。
#
# crates 作业不需要任何桌面系统库，也不需要额外安装步骤——这正是把 keyring 等平台集成
# 从纯 Rust 层移走换来的。它跑得快，也顺带证明「代理与桌面壳解耦」这条分层约束没被破坏。
on:
  push:
    paths:
      - "src/rust/**"
      - "src/tauri/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/rust.yml"
  pull_request:
    paths:
      - "src/rust/**"
      - "src/tauri/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/rust.yml"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  crates:
    name: 纯 Rust 层
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test -p aurora-protocol -p aurora-runtime-broker
      # 分层守卫：代理层必须与桌面壳、平台集成库解耦，否则 Linux 上就要装 dbus 等系统库，
      # 「可脱离桌面壳单独编译与测试」也就不成立了。
      - name: 断言代理层不含桌面壳与平台集成依赖
        shell: bash
        run: |
          tree="$(cargo tree -p aurora-runtime-broker --prefix none)"
          if grep -qiE '\b(tauri(-[a-z]+)?|keyring|dbus|secret-service) v' <<<"$tree"; then
            echo "::error::aurora-runtime-broker 不得依赖桌面壳或平台集成库"
            grep -iE '\b(tauri(-[a-z]+)?|keyring|dbus|secret-service) v' <<<"$tree"
            exit 1
          fi

  # 桌面壳：平台集成（钥匙串、窗口、打包）都在这里，三平台都要能编译。
  # 只有 Linux 需要额外系统库。
  shell:
    name: Tauri 壳
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: 安装 Tauri 的 Linux 系统依赖
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev \
            libdbus-1-dev pkg-config
      - run: cargo check -p aurora-desktop
