name: Python

# 只管 Python 的两层：src/agent（aurora-agent）与 src/cli（aurora-cli）。
#
# 三平台矩阵：这是个跨平台桌面应用，只有在 Windows / macOS 上也跑一遍，
# 才不会出现「在写代码的那台机器上绿、在用户机器上红」的情况。
on:
  push:
    paths:
      - "src/agent/**"
      - "src/cli/**"
      - "pyproject.toml"
      - "uv.lock"
      - "pyrightconfig.json"
      - ".github/workflows/python.yml"
  pull_request:
    paths:
      - "src/agent/**"
      - "src/cli/**"
      - "pyproject.toml"
      - "uv.lock"
      - "pyrightconfig.json"
      - ".github/workflows/python.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      # 一份 uv.lock 同时装好 aurora-agent 与 aurora-cli。
      - run: uv sync --frozen
      - run: uv run --frozen ruff check .
      - run: uv run --frozen ruff format --check .
      - run: uv run --frozen pyright
      # 先把浏览器装上，让预览测试在主测试里真正执行，而不是被 skip 掩盖。
      - name: 安装 Chromium
        if: matrix.os == 'ubuntu-latest'
        run: uv run --frozen playwright install --with-deps chromium
      - run: uv run --frozen pytest -v
      # 冒烟：两个分布的入口都能导入（re-export 与实现文件必须同步）。
      - run: >-
          uv run --frozen python -c
          "from aurora.agent.transport import serve_websocket; from aurora.cli.main import build_parser"

      # 下面两步只在一个平台跑，避免同一件事重复六次。
      - run: uv run --frozen pip-audit
        if: matrix.os == 'ubuntu-latest'

      # gitleaks-action 对组织仓库要求付费 License，这里直接用 OSS 版 CLI；
      # 版本写死以便复现（本地已跑过全历史扫描，无告警）。
      - name: 密钥扫描（gitleaks）
        if: matrix.os == 'ubuntu-latest'
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks detect --source . --redact --no-banner
