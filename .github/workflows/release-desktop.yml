name: Release Desktop

# 桌面发行包：Python sidecar + 前端静态产物 + Tauri bundle。
#
# 注意 projectPath 指向 src/tauri（而不是仓库根）：Tauri CLI 以该目录为 Rust 壳工程，
# 再按 tauri.conf.json 里的相对路径找到 src/frontend。这与本地 `pnpm tauri` 用的是
# 同一套约定。
on:
  push:
    tags:
      - "aurora-desktop-v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: src/frontend/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9

      - name: 安装 Tauri 的 Linux 系统依赖
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev

      - name: 安装前端依赖
        working-directory: src/frontend
        run: pnpm install --frozen-lockfile

      - name: 构建 Python sidecar
        run: node src/tauri/scripts/build-sidecar.mjs

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: src/tauri
          tagName: ${{ github.ref_name }}
          releaseName: "Aurora Agent ${{ github.ref_name }}"
          releaseDraft: true
          prerelease: false
