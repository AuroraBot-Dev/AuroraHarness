name: Frontend

# Nuxt 前端层。E2E 通过 VITE_RUNTIME_WS 指向一个不存在的端口，因此不需要 Python 运行时。
on:
  push:
    paths:
      - "src/frontend/**"
      - ".github/workflows/frontend.yml"
  pull_request:
    paths:
      - "src/frontend/**"
      - ".github/workflows/frontend.yml"

permissions:
  contents: read

defaults:
  run:
    working-directory: src/frontend

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: src/frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:coverage
      - run: pnpm audit --prod --audit-level high
      # gitleaks-action 对组织仓库要求付费 License，这里直接用 OSS 版 CLI。
      - name: 密钥扫描（gitleaks）
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks detect --source . --redact --no-banner
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
